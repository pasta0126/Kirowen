# Reference deployment of Kirowen on a single host behind Traefik
# (external "proxy" network, "websecure" entrypoint, "le" ACME resolver).
#
# - api: kirowend, the registry and HTTP API (kirowen-api.<domain>). It is
#   the only writer of data/.
# - log: nginx serving the website (web/) and the public log, read-only
#   (kirowen.<domain>).
#   Envelopes, state.db and keys are never mounted into it.

services:
  api:
    image: alpine:3.22
    container_name: kirowen-api
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    command:
      - /app/kirowend
      - -data=/data
      - -log-key=/keys/log.key
      - -system-key=/keys/system.key
      - -listen=:8080
      - -log-url=https://kirowen.northernarchive.com/log/v0/
      - -trust-proxy
    volumes:
      - ./bin:/app:ro
      - ./keys:/keys:ro
      - ./data:/data
    stop_grace_period: 40s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kirowen-api.rule=Host(`kirowen-api.northernarchive.com`)"
      - "traefik.http.routers.kirowen-api.entrypoints=websecure"
      - "traefik.http.routers.kirowen-api.tls.certresolver=le"
      - "traefik.http.services.kirowen-api.loadbalancer.server.port=8080"

  log:
    image: nginx:1.29-alpine
    container_name: kirowen-log
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./data/log:/srv/log:ro
      - ./web:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kirowen-log.rule=Host(`kirowen.northernarchive.com`)"
      - "traefik.http.routers.kirowen-log.entrypoints=websecure"
      - "traefik.http.routers.kirowen-log.tls.certresolver=le"
      - "traefik.http.services.kirowen-log.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
