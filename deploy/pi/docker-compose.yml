# Reference deployment of the public Kirowen log on a single host behind
# Traefik (external "proxy" network, "websecure" entrypoint, "le" ACME
# resolver).
#
# Only the public log (tiles, entry bundles, checkpoint) is served. The
# envelopes in data/envelopes and the registry key in keys/ are never
# mounted into the web container.
#
# Writes happen out of band in phase 0: `kirowen add` run on the host.

services:
  log:
    image: nginx:1.29-alpine
    container_name: kirowen-log
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./data/log:/srv/log:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kirowen-log.rule=Host(`kirowen.northernarchive.com`)"
      - "traefik.http.routers.kirowen-log.entrypoints=websecure"
      - "traefik.http.routers.kirowen-log.tls.certresolver=le"
      - "traefik.http.services.kirowen-log.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
