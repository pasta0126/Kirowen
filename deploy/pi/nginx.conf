# Serves the website (web/) at / and a C2SP tlog-tiles log as static files
# under /log/v0/.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Anyone may read the log, from any origin. Note: add_header in a
    # location replaces these, so each location repeats them.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Website: landing, browser registration and the API console. The CSP
    # allows only our own scripts, Swagger UI from jsDelivr (pinned, with SRI)
    # and calls to the API.
    location / {
        root /srv/web;
        index index.html;
        try_files $uri $uri/ =404;
        types {
            text/html html;
            text/css css;
            text/javascript js;
            application/yaml yaml;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://kirowen-api.northernarchive.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The checkpoint changes with every new tree head: never cache it.
    location = /log/v0/checkpoint {
        alias /srv/log/checkpoint;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Partial tiles and bundles (".p/") are replaced as the tree grows.
    location ~ ^/log/v0/(tile/.*\.p/.*)$ {
        alias /srv/log/$1;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Full tiles and entry bundles never change once written.
    location ~ ^/log/v0/(tile/.*)$ {
        alias /srv/log/$1;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nothing else under /log/ is served: no directory listings, no lock files.
    location /log/ {
        return 404;
    }
}
