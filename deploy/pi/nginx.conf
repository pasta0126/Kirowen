# Serves a C2SP tlog-tiles log as static files under /log/v0/.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Anyone may read the log, from any origin. Note: add_header in a
    # location replaces these, so each location repeats them.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        default_type text/plain;
        return 200 "Kirowen public log\norigin: kirowen.northernarchive.com/log/v0\ncheckpoint: https://kirowen.northernarchive.com/log/v0/checkpoint\nhttps://github.com/pasta0126/Kirowen\n";
    }

    # The checkpoint changes with every new tree head: never cache it.
    location = /log/v0/checkpoint {
        alias /srv/log/checkpoint;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Partial tiles and bundles (".p/") are replaced as the tree grows.
    location ~ ^/log/v0/(tile/.*\.p/.*)$ {
        alias /srv/log/$1;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Full tiles and entry bundles never change once written.
    location ~ ^/log/v0/(tile/.*)$ {
        alias /srv/log/$1;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nothing else is served: no directory listings, no lock files.
    location / {
        return 404;
    }
}
